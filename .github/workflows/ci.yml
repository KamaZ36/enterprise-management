name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Значения совпадают с tests/conftest.py: тесты поднимают схему в отдельной базе.
env:
  DEBUG: "true"
  DB_USER: user
  DB_PASSWORD: password
  DB_HOST: localhost
  DB_PORT: "5432"
  DB_DATABASE: myasnaya_derevnya_test
  INITIAL_ADMIN_USERNAME: admin
  INITIAL_ADMIN_PASSWORD: admin
  ADMIN_ROLE_CODE: SUPER_ADMIN
  ADMIN_ROLE_NAME: Технический администратор
  LOGIN_CODE_SECRET: ci-login-code-secret

jobs:
  backend:
    name: Бэкенд
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: myasnaya_derevnya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d myasnaya_derevnya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Установить зависимости
        run: uv sync --frozen --all-groups

      - name: Линтер
        run: uv run ruff check .

      - name: Миграции на тестовую базу
        run: uv run alembic upgrade head

      - name: Тесты
        run: uv run pytest -q

  frontend:
    name: Фронтенд
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Типы админки
        run: pnpm typecheck:admin

      - name: Сборка лендинга
        run: pnpm build:landing

      - name: Типы и сборка кафе
        run: pnpm build:cafe
