[Definition]

# Неудачные попытки входа сотрудника: 401/403/429 на /api/auth/login/...
# Строка сформирована log_format md_api в deploy/nginx/myasnaya-derevnya.conf.
# fail2ban вырезает дату из строки перед сопоставлением, поэтому внутри
# квадратных скобок остаётся пусто: [^]]* (не +).
failregex = ^<HOST> - \S+ \[[^]]*\] "(?:POST|GET|PUT) /api/auth/login[^"]*" (?:401|403|429) \d+

ignoreregex =
