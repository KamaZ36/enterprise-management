# Nginx для myasnaya-derevnya.ru.
#
# Сейчас домен ещё не указывает на сервер, поэтому приложения доступны по IP
# на разных портах. Когда DNS заработает — выполните:
#   certbot --nginx -d myasnaya-derevnya.ru -d www.myasnaya-derevnya.ru \
#     -d team.myasnaya-derevnya.ru -d cafe.myasnaya-derevnya.ru \
#     -d api.myasnaya-derevnya.ru
# Certbot сам добавит listen 443 ssl в блоки ниже.
#
# Статика лежит в /opt/myasnaya-derevnya/web/{landing,admin,cafe}
# и обновляется скриптом scripts/server-deploy.sh.

log_format md_api '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rt=$request_time';

# --------------------------------------------------------------------------
# Лендинг: http://<ip>/ и https://myasnaya-derevnya.ru
# --------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name myasnaya-derevnya.ru www.myasnaya-derevnya.ru;

    root /opt/myasnaya-derevnya/web/landing;
    index index.html;

    server_tokens off;
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/md-landing-access.log;
    error_log  /var/log/nginx/md-landing-error.log;

    location /_nuxt/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --------------------------------------------------------------------------
# Админка: https://team.myasnaya-derevnya.ru
# --------------------------------------------------------------------------
server {
    listen 80;
    server_name team.myasnaya-derevnya.ru;

    root /opt/myasnaya-derevnya/web/admin;
    index index.html;

    server_tokens off;
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/md-admin-access.log;
    error_log  /var/log/nginx/md-admin-error.log;

    location /_nuxt/ {
        expires 1y;
        try_files $uri =404;
    }

    location /api/ {
        access_log /var/log/nginx/md-api-access.log md_api;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /media/ {
        expires 30d;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --------------------------------------------------------------------------
# Кафе: https://cafe.myasnaya-derevnya.ru
# --------------------------------------------------------------------------
server {
    listen 80;
    server_name cafe.myasnaya-derevnya.ru;

    root /opt/myasnaya-derevnya/web/cafe;
    index index.html;

    server_tokens off;
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/md-cafe-access.log;
    error_log  /var/log/nginx/md-cafe-error.log;

    location /_nuxt/ {
        expires 1y;
        try_files $uri =404;
    }

    # /menu — одновременно страница приложения и каталог с фото блюд.
    # Точные адреса отдают SPA, вложенные пути — статические файлы.
    location = /menu {
        try_files /index.html =404;
    }

    location = /menu/ {
        try_files /index.html =404;
    }

    location ^~ /menu/ {
        expires 30d;
        try_files $uri =404;
    }

    location /api/ {
        access_log /var/log/nginx/md-api-access.log md_api;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /media/ {
        expires 30d;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --------------------------------------------------------------------------
# API для агента DoKa: https://api.myasnaya-derevnya.ru
# --------------------------------------------------------------------------
server {
    listen 80;
    server_name api.myasnaya-derevnya.ru;

    server_tokens off;
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain;

    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/md-api-access.log md_api;
    error_log  /var/log/nginx/md-api-error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
